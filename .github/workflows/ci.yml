  Ping-IRC:
    # Always run, announce tag and trunk pushes only
    if: ${{ always() && github.event_name == 'push' && (github.ref == 'refs/heads/trunk' || github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    needs: [ Build-And-Test, Release ]
    steps:
    - { uses: actions/checkout@v7, with: { fetch-depth: 0 } }
    - run: git fetch -f --tags          # Fix actions/checkout#290
    # run: python3 .github/workflows/test_ircbot.py --preview
    - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/workflows -p test_ircbot.py -v
    - name: Ping-IRC
      if: ${{ !env.ACT }}  # IRCBOT_JOBS indicates 'success'
      env: { IRCBOT_JOBS: "${{ join(needs.*.result, ' ') }}" }
      run: .github/workflows/ircbot.py -s irc.libera.chat:6697 -G "#Anklang"
