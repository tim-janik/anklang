# Lint: xclip -sel c < .github/workflows/ci.yml # https://rhysd.github.io/actionlint/

on:
  push:
    branches: [ 'trunk', 'wip/**' ]
    tags: [ 'v[0-9]*.[0-9]*' ]
  pull_request:
    branches: [ 'trunk' ]

permissions: { contents: read }

jobs:

  Build-And-Test:
    runs-on: ubuntu-latest
    container: { image: 'ghcr.io/tim-janik/anklang-ci:ci-latest', options: --user runner }
    env: { CCACHE_DIR: /tmp/ccache, CCACHE_MAXSIZE: 2G } # CCACHE_DIR enables $(CCACHE)
    steps:
    - { uses: actions/checkout@v7, with: { fetch-depth: 0, fetch-tags: true } }
    - run: git fetch --force --tags     # Fix actions/checkout#290
    - uses: actions/cache/restore@v6    # PRs may restore caches, e.g. from trunk
      with:
        path: /tmp/ccache
        key: ccache-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ github.ref_name }}-
          ccache-
    - run: ccache -z
    - run: |
        make -w dist
        mkdir /tmp/anklang && tar xf artifacts/anklang-*.tar.zst -C /tmp/anklang --strip-components=1
        cd /tmp/anklang
        echo -e ' prefix=/tmp/inst\n CC=clang \n CXX=clang++ \n INSN=fma \n MODE=devel ' > config-defaults.mk     # no LTO, production builds are for releases
    - uses: actions/upload-artifact@v7
      with: { name: AnklangTarball, path: artifacts/ }
    - run: make -C /tmp/anklang -w all -j`nproc`
    - run: ccache -s
    - uses: actions/cache/save@v6       # untrusted PRs must not write caches (cache poisoning)
      if: github.event_name == 'push'
      with: { path: /tmp/ccache, key: 'ccache-${{ github.ref_name }}-${{ github.sha }}' }
    - run: make -C /tmp/anklang -w strict -j`nproc`
    - run: make -C /tmp/anklang -w install
    - run: make -C /tmp/anklang -w installcheck -j`nproc`
    - run: make -C /tmp/anklang -w uninstall

  Release:
    if: github.ref_type == 'tag'        # constrained by on.push.tags
    needs: [ Build-And-Test ]
    runs-on: ubuntu-latest
    permissions: { contents: write }    # allow github.token to create a release
    env:
      GH_TOKEN: '${{ github.token }}'
      DOCKER_IMAGE: 'ghcr.io/tim-janik/anklang-ci:ci-latest'
    steps:
    - { uses: actions/checkout@v7, with: { fetch-depth: 0, fetch-tags: true } }
    - run: git fetch -f --tags  # Fix actions/checkout#290
    - run: .github/workflows/gh-release.sh --docker --upload

