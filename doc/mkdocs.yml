# https://www.mkdocs.org/getting-started/
site_name: Anklang Documentation
copyright: Copyright &copy; 2025 Anklang Project
site_url: https://tim-janik.github.io/anklang
repo_url: https://github.com/tim-janik/anklang
repo_name: Anklang.git
# Note, mkdocs.yml is used in the build dir, with source dirs as symlink
docs_dir: mkdocs/doc
site_dir: site/

plugins:
  - live-edit
  - search
  - privacy:
      # https://squidfunk.github.io/mkdocs-material/plugins/privacy/?h=blank#config.links_attr_map
      #links_attr_map: target: _blank	# <- https://github.com/squidfunk/mkdocs-material/issues/6601
  - offline
  - tags
  - literate-nav:
      nav_file: NAV.md
      tab_length: 2
  - file-filter:
      exclude_glob:
        - '*akefile*'
        - copyright.ini

extra_css:
  - style/mkdocs.css
extra_javascript:
  - javascript/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# https://squidfunk.github.io/mkdocs-material/getting-started/
theme:
  name: material
  language: 'en'
  features:
    - search.suggest
    - search.highlight
    - search.share
    - navigation.instant
    - navigation.prune
    #- toc.integrate
    - toc.follow
    - navigation.tracking
    #- navigation.tabs
    #- navigation.tabs.sticky
    - navigation.sections
    #- navigation.expand
    - navigation.path
  #  - navigation.footer
  # taken from https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/#system-preference
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to system preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
extra:
  generator: false
  social:
    - icon: fontawesome/brands/mastodon
      link: https://social.tchncs.de/@timj

# https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown-extensions/
markdown_extensions:
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: false
      use_pygments: true
      pygments_lang_class: true
      auto_title: false
      linenums: true
      line_spans: __span
      linenums_style: pymdownx-inline
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - markdown.extensions.tables
  - pymdownx.fancylists
  - pymdownx.saneheaders

# nav: see NAV.md

