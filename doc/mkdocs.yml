site_name: Anklang Documentation
site_url: https://mydomain.org/mysite
repo_url: https://github.com/tim-janik/anklang
repo_name: Anklang.git
docs_dir: mkdocs
site_dir: site

plugins:
  - search
  - privacy
    # https://squidfunk.github.io/mkdocs-material/plugins/privacy/?h=blank#config.links_attr_map
    # links_attr_map:
    #   target: _blank
  - offline
  - tags
  #- blog
  #- git-revision-date-localized:
  #    type: timeago
  #    fallback_to_build_date: true
  #    enable_creation_date: true

  - mkdoxy:
      projects:
        AnklangCxx:
          src-dirs: ../ase/ ../devices/
          doxy-cfg:
            FILE_PATTERNS: "*.c .h *.cc *.hh *.js *.md *.dox"
            INTERNAL_DOCS: YES
            RECURSIVE: NO
            EXTRACT_LOCAL_CLASSES: NO
            HIDE_UNDOC_MEMBERS: YES
            HIDE_UNDOC_CLASSES: YES
            HIDE_FRIEND_COMPOUNDS: YES
            HIDE_COMPOUND_REFERENCE: YES
            SHOW_INCLUDE_FILES: NO
            INLINE_INFO: NO
            SHOW_USED_FILES: NO
            VERBATIM_HEADERS: NO
            XML_PROGRAMLISTING: NO
            COLLABORATION_GRAPH: NO
            GROUP_GRAPHS: NO
            INCLUDE_GRAPH: NO
            INCLUDED_BY_GRAPH: NO
            GRAPHICAL_HIERARCHY: NO
            DIRECTORY_GRAPH: NO
            DOT_IMAGE_FORMAT: svg
            EXTRACT_ALL: NO
            EXTRACT_ANON_NSPACES: NO

extra_javascript:
  - javascript/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js



nav:
  - Home: index.md
  - "Get Started: Intro & Tutorials":
    - Introduction: ch-intro.md
    - Installation: ch-install.md
    - Anklang Overview: ch-editing.md
    - "Tutorial 1: Starting to Play Notes": tut-play.md
  - "Howto Guides":
    - "Howto: Setting Up Audio (Linux)": how-audio.md
  - "Reference":
    - "ANKLANG(1) Manual Page": ch-man-pages.md
    - "User Interface":
      - Clip-List: cliplist.md
      - Piano-Ctrl: piano-ctrl.md
      - Piano-Roll: pianoroll.md
    - JS Scripting: scripting-docs.md
    - "Anklang C++ API":
      - 'C++ Class-Tree':       class-tree.md
      - 'C++ API Links':        AnklangCxx/links.md
      - 'Class List':           AnklangCxx/annotated.md
      - 'Class Members':        AnklangCxx/class_members.md
      - 'Namespace List':       AnklangCxx/namespaces.md
      - 'Namespace Members':    AnklangCxx/namespace_members.md
      - 'Files':                AnklangCxx/files.md
  - "Design & Development":
    - Development Overview: ch-development.md
    - UI Development:
      - Web Components: ch-component.md
      - Component API: jsdocs.md
    - Implementation Details:
      - Making Releases: ch-releasing.md
      - Interpolation Notes: ch-appendix.md

# TODO: Piano-Ctrl lacks tools icons


theme:
  name: material
  language: 'en'
  #features:
  #  - navigation.footer
  features:
    - search.suggest
    - search.highlight
    - search.share
    - toc.integrate
    - navigation.tracking
    #- navigation.tabs
    - navigation.sections
    #- navigation.expand
    - navigation.path

  # taken from https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/#system-preference
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to system preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode



copyright: Copyright &copy; 2024 Anklang Project

extra:
  generator: false
  social:
    - icon: fontawesome/brands/mastodon
      link: https://social.tchncs.de/@timj

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


